<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Noor Probe</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--muted:#777a82;--line:#e5e5ea;--blue:#007aff;--side:rgba(238,239,243,.94);--hero:#eaf2fe;--orange:#b96a00;--red:#d83b3b;--green:#29945b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);padding:9px 13px;white-space:nowrap;transition:.15s}button:hover{filter:brightness(.97)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #007aff55;outline-offset:2px}button:disabled{opacity:.4;cursor:default}.primary{background:var(--blue);color:white;border-color:transparent}.danger{color:var(--red)}.soft{background:#007aff10;border-color:#007aff22;color:var(--blue)}.layout{display:grid;grid-template-columns:224px 1fr;direction:ltr;height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:30px 14px 18px;display:flex;flex-direction:column;direction:rtl}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 30px;direction:ltr}.brandmark{font-size:25px;color:var(--blue);width:40px;height:40px;background:#007aff12;border-radius:13px;display:grid;place-items:center}.brand strong{font-size:19px;letter-spacing:-.5px}.eyebrow{font-size:9px;letter-spacing:1.3px;color:var(--muted);margin-top:5px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{background:none;border:0;text-align:right;display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px}.nav button.selected{color:var(--blue);background:#007aff12;font-weight:600}.icon{font-size:19px;width:24px;text-align:center;color:var(--blue)}.sidefoot{margin-top:auto;padding:18px 12px 0;font-size:11px;color:var(--muted);line-height:1.8}.sidefoot b{display:block;color:var(--text);font-weight:500}.main{direction:rtl;overflow:auto}.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar h1{font-size:21px;margin:0 0 6px;letter-spacing:-.5px}.status{font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center}.content{max-width:1160px;margin:auto;padding:28px 32px 40px;display:flex;flex-direction:column;gap:20px}.hero{padding:32px;border-radius:23px;background:linear-gradient(115deg,var(--hero),var(--surface));display:flex;align-items:center;gap:26px;min-height:166px}.hero h2{font-size:30px;letter-spacing:-1px;line-height:1.4;margin:0 0 10px}.hero p{font-size:15px;margin:0;color:var(--muted)}.heroicon{font-size:65px;color:var(--blue);line-height:1}.row{display:flex;gap:14px;align-items:center}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.metric{border:1px solid var(--line);background:var(--surface);padding:20px;border-radius:17px}.metric b{display:block;font-size:31px;font-weight:600;margin:12px 0 7px;letter-spacing:-1px}.metric small{color:var(--muted)}.card{padding:22px;border:1px solid var(--line);background:var(--surface);border-radius:17px}.card h3{font-size:16px;margin:0 0 14px}.muted{color:var(--muted);line-height:1.8}.note{font-size:12px;color:var(--muted);line-height:1.9}.path{direction:ltr;text-align:left;overflow-wrap:anywhere;font:11px Menlo,monospace;color:var(--muted)}.between{display:flex;justify-content:space-between;align-items:center;gap:16px}.chip{display:inline-block;padding:5px 8px;background:#007aff10;color:var(--blue);font:11px Menlo,monospace;border-radius:7px;direction:ltr}.chip.error{background:#f0444410;color:var(--red)}.chip.warning{background:#ff950015;color:var(--orange)}.issue h3{font-size:15px;margin:0}.issue p{line-height:1.9;margin:12px 0;color:var(--muted)}.issue .recommendation{color:var(--text);font-size:13px}.issuefooter{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);gap:10px}.textbutton{color:var(--blue);background:transparent;border:0;padding:4px;font-size:12px}.empty{text-align:center;padding:45px 20px;color:var(--muted);line-height:2}.empty .large{font-size:36px;color:var(--blue);margin-bottom:12px}.listrow{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px}.listrow:last-child{border:0}.listrow strong{display:block;font-size:13px}.listrow small{display:block;color:var(--muted);margin-top:5px}.sectiontitle{font-size:24px;letter-spacing:-.6px;margin:0}.search{width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:11px;color:var(--text);background:var(--surface)}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}textarea{width:100%;min-height:400px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:18px;font:12px/1.7 Menlo,monospace;direction:ltr;text-align:left;color:var(--text);background:var(--bg);tab-size:2}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.65 Menlo,monospace;direction:ltr;text-align:left;max-height:600px;overflow:auto;margin:16px 0 0}.files{max-height:370px;overflow:auto}.file{font:11px/2 Menlo,monospace;direction:ltr;text-align:left;border-bottom:1px solid var(--line);padding:3px}.pill{font:10px Menlo,monospace;border-radius:5px;padding:3px 5px;background:#007aff12;color:var(--blue);margin-right:6px}.folders{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.folder{background:var(--bg);padding:17px;border:1px solid var(--line);border-radius:12px}.folder strong{display:block;font-size:15px;margin:8px 0 6px}.folder small{color:var(--muted);line-height:1.6}.banner{padding:13px 17px;border-radius:12px;background:#ff950012;border:1px solid #ff950025;color:var(--orange);font-size:12px;line-height:1.9}.spinner{width:14px;height:14px;border-radius:50%;border:2px solid #007aff30;border-top-color:var(--blue);animation:spin .8s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}details{background:var(--surface);border:1px solid var(--line);padding:18px;border-radius:14px}summary{cursor:pointer;font-weight:600}label{display:flex;align-items:center;gap:9px;line-height:1.7}input[type=checkbox]{accent-color:var(--blue)}input[type=number]{width:130px;padding:10px;border-radius:9px;background:var(--bg);border:1px solid var(--line);color:var(--text)}.stack{display:flex;flex-direction:column;gap:18px}.badge{font-size:10px;border:1px solid var(--line);padding:4px 7px;border-radius:6px;color:var(--muted)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--surface:#28282a;--text:#f5f5f7;--muted:#aaaab3;--line:#38383b;--side:#232326;--hero:#182a42;--blue:#399bff;--orange:#e6a34c;--red:#ff7777}.primary{background:#007aff}.card{box-shadow:0 1px 0 #ffffff04}}

:root{--canvas:linear-gradient(150deg,#e3ecff,#f5f3fa 54%,#e9f4f1);--glass:rgba(255,255,255,.64);--surface:#ffffffdb;--side:#ffffff54}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--canvas:linear-gradient(150deg,#151e34,#171822 58%,#172723);--glass:#232637d6;--surface:#252738e8;--side:#16192880}}
:root[data-theme="dark"]{color-scheme:dark;--canvas:linear-gradient(150deg,#151e34,#171822 58%,#172723);--glass:#232637d6;--surface:#252738e8;--side:#16192880;--bg:#202231;--text:#f2f3fa;--line:#3e4256;--muted:#b2b7cb;--blue:#66aaff;--hero:#253654}
:root[data-theme="light"]{color-scheme:light;--bg:#f5f5f7;--text:#1d1d1f;--line:#e0e5ef;--muted:#626878;--blue:#0066db;--hero:#edf4ff}
body{background:var(--canvas)}.sidebar,.toolbar{background:var(--glass);backdrop-filter:blur(24px) saturate(145%)}.sidebar{margin:10px 0 10px 10px;border:1px solid var(--line);border-radius:22px;padding-top:19px}.toolbar{margin:10px 12px 0;border:1px solid var(--line);border-radius:20px}.hero,.card,.metric{box-shadow:0 6px 24px #141f3610}.ai-config{display:grid;grid-template-columns:minmax(9em,1fr) 2fr auto;gap:8px;align-items:center;padding:8px 0}.ai-config input{min-width:0}.ai-answer{white-space:pre-wrap;overflow-wrap:anywhere}.ai-question{min-height:112px;direction:rtl;text-align:right}.theme-control{padding:6px;border-radius:8px}button.primary{background:#0964ce}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><div class="brandmark">⌁</div><div><strong>Noor Probe</strong><div class="eyebrow">OPENCORE DIAGNOSTICS</div></div></div><nav class="nav" id="nav"></nav><label class="note" for="theme">المظهر <select id="theme" class="theme-control"><option value="system">النظام</option><option value="light">نهاري</option><option value="dark">ليلي</option></select></label><div class="sidefoot"><b>الإصدار 2 Beta 3</b>فحص محلي ومساحة تعديل منفصلة.<br>الأصل يبقى محفوظاً.</div></aside><main class="main"><header class="toolbar"><div><h1 id="heading">نظرة عامة</h1><div class="status" id="status">جارٍ تهيئة التطبيق…</div></div><div class="actions"><span id="spinner" hidden class="spinner"></span><button data-action="chooseEFI">اختيار EFI</button><button data-action="export">تصدير</button><button class="primary" data-action="scan">⌁ فحص الجهاز</button></div></header><div id="content" class="content"></div></main></div>
<script>
'use strict';
let state={efi:'',workspace:'',report:null,info:null,busy:false,status:'جاهز للفحص',runtime:''};
let page='overview',tab='files',search='',updates=false,replace=false,editorDraft='',lastConfig='',layoutValue='',ocVersion='',repoValue='acidanthera/Lilu',updateRepo='';
const pages=[['overview','◫','نظرة عامة'],['hardware','▦','المكونات'],['deep','◎','الفحص المتعمّق'],['ai','✦','مساعد AI'],['efiBrowser','▣','أقسام EFI'],['catalog','↓','التنزيل والتطبيق'],['issues','⌁','التشخيص'],['drivers','⬡','التعريفات'],['workspace','▣','مساحة EFI'],['updates','↻','تحديث التطبيق'],['about','ⓘ','عن البرنامج']];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function send(action,extra={}){const msg={action,...extra}; if(window.webkit?.messageHandlers?.noor)window.webkit.messageHandlers.noor.postMessage(msg);else if(action==='ready')receiveState(state);else window.dispatchEvent(new CustomEvent('noor-preview-action',{detail:msg}));}
function receiveState(value){state=value;if(typeof state.updateRepo==='string')updateRepo=state.updateRepo;if(state.info?.config!==lastConfig){lastConfig=state.info?.config||'';editorDraft=lastConfig;}render();}window.receiveState=receiveState;
const empty=(text='ابدأ فحص الجهاز لعرض النتائج الفعلية.')=>`<div class="empty"><div class="large">⌁</div>${esc(text)}</div>`;
function card(f){return `<article class="card issue"><div class="between"><h3>${esc(f.title)}</h3><span class="chip ${esc(f.severity)}">${esc(f.code)}</span></div><p>${esc(f.detail)}</p><p class="recommendation">${esc(f.action)}</p><div class="issuefooter"><span>${esc(f.category)} · ${f.confidence==='manual'?'اختبار فعلي مطلوب':f.confidence==='likely'?'استنتاج يحتاج تحقق':'قاعدة أو ملاحظة مثبتة'}</span><button class="textbutton" data-action="link" data-url="${esc(f.source)}">التوثيق الأصلي ↗</button></div></article>`;}
function metric(title,value,icon){return `<div class="metric"><span class="icon">${icon}</span><b>${esc(value)}</b><small>${esc(title)}</small></div>`;}
function overview(){const r=state.report;return `<section class="hero"><div class="heroicon" aria-hidden="true">▱</div><div><h2>جهازك، بصورة أوضح.</h2><p>افهم المكونات. راجع التوافق. جرّب التعديل.</p></div></section><div class="metrics">${metric('ملاحظات الفحص',r?r.findings.length:'—','⌁')}${metric('أخطاء في الملفات والإعدادات',r?r.findings.filter(f=>f.severity==='error').length:'—','⚠')}${metric('تعريفات EFI',r?r.kexts.length:'—','⬡')}</div><div class="card"><div class="between"><h3>مصدر EFI</h3><button data-action="chooseEFI">اختيار المجلد</button></div><div class="path">${esc(state.efi||'لم يتم اختيار EFI')}</div><p class="note">اختيار المجلد لا يثبت أنه مصدر الإقلاع الحالي. يمكن فحص النظام بدونه.</p></div><label><input id="updates" type="checkbox" ${updates?'checked':''}>استعلام إصدارات المشاريع من GitHub أثناء الفحص</label><div class="note">التحديث الأحدث ليس بالضرورة الأنسب. غياب البيانات لا يعني غياب القطعة أو عدم دعمها.</div>${r?r.findings.filter(f=>f.severity==='error').slice(0,3).map(card).join(''):empty()}`;}
function hardware(){let p=state.report?.snapshot?.probes;return `<h2 class="sectiontitle">المكونات التي يكشفها macOS</h2><div class="muted">المعالج والذاكرة وPCI والشاشة والشبكات والصوت وUSB والتخزين والطاقة. المكونات المخفية في BIOS أو ACPI قد لا تظهر، وSMBIOS قد يكون مموّهاً.</div>${p?Object.entries(p).map(([name,data])=>`<details><summary>${esc(name)} <span class="badge">${data.ok?'بيانات متوفرة':'فشل الاستعلام'}</span></summary><pre>${esc(JSON.stringify(data,null,2))}</pre></details>`).join(''):empty()}`;}
function issues(){return `<input id="search" class="search" placeholder="ابحث بالكود أو المشكلة أو المكوّن" value="${esc(search)}" aria-label="البحث في التشخيص"><div id="issueList" class="stack">${issueList()}</div>`;}
function issueList(){return state.report?state.report.findings.filter(f=>(f.code+f.title+f.category+f.detail).toLowerCase().includes(search.toLowerCase())).map(card).join('')||empty('لا توجد نتائج مطابقة.'):empty();}
function drivers(){const r=state.report;return `<h2 class="sectiontitle">تعريفات EFI</h2><div class="note">نقارن MinKernel وMaxKernel بنسخة Darwin الحالية. النتيجة تشرح شرط OpenCore فقط؛ لا تثبت أن التعريف مناسب للقطعة أو أن الإقلاع سيعمل. إذا كانت EFI لجهاز آخر، تجاهل مقارنة النظام الحالي. الذكاء الاصطناعي اختياري؛ الفحص الأساسي وقواعد التوافق المحلية تعمل بدونه.</div>${r?`<div class="card">${r.kexts.map(k=>{const range=k.host_kernel_range;const label=range==='outside-range'?'شرط النواة يستبعد النظام الحالي':range==='inside-range'?'نطاق النواة يشمل النظام الحالي':range==='not-set'?'لا يوجد نطاق محدد':'تعذر المقارنة';const cls=range==='outside-range'?'warning':'';return `<div class="listrow"><div><strong dir="ltr">${esc(k.name)}</strong><small dir="ltr">${esc(k.version)} · ${esc(k.min||'Any')} → ${esc(k.max||'Any')}</small><small>${esc(label)}${k.host_kernel?' · Darwin '+esc(k.host_kernel):''}</small></div><span class="chip ${!k.exists?'error':cls}">${!k.exists?'ملف مفقود':k.enabled?'مفعّل في config':'معطّل'}</span></div>`}).join('')||empty('لم يتم رصد مراجع kext في EFI المختارة.')}</div>`:empty()}<h2 class="sectiontitle">مقارنة الإصدارات</h2>${r?.releases.length?r.releases.map(x=>`<div class="card"><h3 dir="ltr">${esc(x.name)}</h3><div class="between"><span>الموجود: <b>${esc(x.installed)}</b></span><span>المصدر: <b>${esc(x.latest)}</b></span></div><p class="note">${esc(x.note)}</p><button class="textbutton" data-action="link" data-url="${esc(x.url)}">مراجعة الإصدار ↗</button></div>`).join(''):'<div class="note">فعّل استعلام GitHub وأعد الفحص لمقارنة الإصدارات. لا يتم تنزيل أو تثبيت التعريفات تلقائياً.</div>'}`;}
function workspace(){return `<div class="between"><h2 class="sectiontitle">مساحة EFI</h2><div class="row"><button data-action="openWorkspace">فتح مساحة سابقة</button><button class="primary" data-action="createWorkspace" ${!state.efi?'disabled':''}>إنشاء مساحة عمل</button></div></div><div class="muted">استورد التعريفات وعدّل الإعدادات داخل Candidate، مع نسخة احتياطية ونقطة استعادة لكل عملية. لا تتم الكتابة على EFI الأصلية.</div>${state.info?workspaceBody():empty('اختر EFI ثم أنشئ مساحة عمل، أو افتح مساحة Noor سابقة.')}`;}
function workspaceBody(){let i=state.info;return `<div class="card"><div class="between"><div class="path">${esc(state.workspace)}</div><button data-action="revealWorkspace">فتح في Finder</button></div><div class="folders"><div class="folder"><span class="icon">▣</span><strong>Backup</strong><small>نسخة المصدر مع بصمات SHA-256.<br>تبقى محفوظة دون تعديل.</small></div><div class="folder"><span class="icon">▣</span><strong>Candidate</strong><small>التعديلات والتعريفات الجديدة.<br>${i.changes.length} ملف مختلف عن الأصل.</small></div></div><div class="row"><button class="soft" data-action="scanCandidate">فحص Candidate</button><button data-action="refreshWorkspace">تحديث القائمة</button></div></div><div class="tabs">${[['files','الملفات والتعريفات'],['editor','محرر config.plist'],['changes','معاينة التغييرات'],['history','سجل التراجع']].map(([key,title])=>`<button data-tab="${key}" class="${tab===key?'active':''}">${title}</button>`).join('')}</div>${tab==='files'?workspaceFiles(i):tab==='editor'?workspaceEditor():tab==='changes'?workspaceChanges(i):workspaceHistory(i)}<div class="card"><h3>التحقق الرسمي • ocvalidate</h3><div class="row"><input id="ocVersion" class="search" style="max-width:190px" placeholder="إصدار OpenCore: 1.0.4" value="${esc(ocVersion)}" aria-label="إصدار OpenCore"><button data-action="validate">اختيار الأداة والتحقق</button></div><p class="note">اختر ocvalidate من حزمة نفس إصدار OpenCore. لا يتم تنزيل أو تشغيل الأداة قبل تأكيدك. مطابقة الإصدار تعتمد على القيمة التي تدخلها؛ البرنامج لا يكشف إصدار OpenCore تلقائياً.</p></div><div class="banner">قبل الإقلاع: استخدم ocvalidate المطابق لإصدار OpenCore، وراجع الاعتمادات واختبر USB. صحة plist لا تعني صحة إعدادات الإقلاع. لا يوجد تثبيت تلقائي على قسم EFI.</div>`;}
function workspaceFiles(i){return `<div class="card"><h3>إضافة ملفات ومراجع OpenCore</h3><div class="row"><button data-action="import" data-kind="kext">＋ إضافة Kext</button><button data-action="import" data-kind="acpi">＋ إضافة ACPI .aml</button><button data-action="import" data-kind="driver">＋ إضافة Driver .efi</button></div><p class="note">اختر ملفات مفكوكة من مصدر موثوق. سيُضاف المرجع إلى config، وتُرتب اعتمادات kext الموجودة. لا يولّد البرنامج التعريف ولا يضمن توافقه.</p><label class="note"><input id="replace" type="checkbox" ${replace?'checked':''}>السماح باستبدال ملف موجود بعد التأكيد</label></div><div class="card"><h3>تفعيل التعريفات في Candidate</h3>${i.kexts.map(k=>`<div class="listrow"><div><strong dir="ltr">${esc(k.name)}</strong><small dir="ltr">${esc(k.path)} · ${esc(k.version)}</small></div><button data-action="toggle" data-bundle="${esc(k.path)}" data-enabled="${!k.enabled}">${k.enabled?'تعطيل':'تفعيل'}</button></div>`).join('')||empty('لا توجد تعريفات مسجلة.')}</div><div class="card"><h3>الملفات (${i.files.length})</h3><div class="files">${i.files.slice(0,500).map(f=>`<div class="file">${esc(f)}</div>`).join('')}</div>${i.files.length>500?'<p class="note">عرض أول 500 ملف. افتح Finder لبقية الملفات.</p>':''}</div>`;}
function workspaceEditor(){return `<div class="card"><div class="between"><h3>config.plist • XML</h3><button class="primary" data-action="saveConfig">مراجعة وحفظ في Candidate</button></div><p class="note">المحرر يعرض إعدادك الحقيقي وقد يحتوي أرقاماً تسلسلية. التعديل محلي. كل حفظ يمر بتحليل plist ونقطة استعادة. راجع التغييرات قبل الاختبار.</p><textarea id="editor" spellcheck="false" autocorrect="off" aria-label="محرر config.plist"></textarea></div><div class="card"><h3>إعداد صوت AppleALC</h3><div class="row"><input id="layout" type="number" min="1" max="255" placeholder="layout-id" value="${esc(layoutValue)}" aria-label="layout-id"><button data-action="layout">معاينة وتأكيد alcid</button></div><p class="note">أدخل قيمة طابقتها مع Codec جهازك. لا يختار التطبيق القيمة بالتخمين.</p></div>`;}
function workspaceChanges(i){return `<div class="card"><h3>مقارنة Backup وCandidate</h3>${i.changes.length?`<div class="files">${i.changes.map(c=>`<div class="file"><span class="pill">${esc(c.change)}</span>${esc(c.path)}</div>`).join('')}</div>`:empty('Candidate مطابقة للنسخة الاحتياطية.')}</div><div class="note">المعاينة تقارن بصمات الملفات. لم تنفذ أي كتابة على EFI الأصلية. لعرض تغييرات config النصية افتح الملفين في محرر وقارنهما قبل الإقلاع.</div>`;}
function workspaceHistory(i){return `<div class="card"><h3>نقاط الاستعادة</h3><p class="note">زر الاستعادة يرجع Candidate إلى ما قبل العملية المختارة، ويحفظ وضعها الحالي في نقطة جديدة. لا يغيّر الأصل أو Backup.</p>${[...i.history].reverse().map(h=>`<div class="listrow"><div><strong dir="ltr">${esc(h.label)}</strong><small dir="ltr">${esc(h.created)}</small></div><button data-action="restore" data-revision="${esc(h.id)}">استعادة ما قبلها</button></div>`).join('')||empty('تظهر هنا عمليات التعديل الناجحة.')}</div>`;}
function about(){return `<section class="hero"><div class="brandmark">⌁</div><div><h2>Noor Probe 2 Beta 3</h2><p>افهم جهازك. عدّل بإدراك.</p></div></section><div class="card"><h3>ما الذي يشغّل التطبيق؟</h3><p class="muted">حزمة macOS مستقلة بواجهة AppKit وWebKit محلية، تعمل بواسطة JavaScript for Automation الموجود في macOS. محرك الفحص والتعديل يحتاج Python 3.9 أو أحدث. لا تحتاج بناء Swift أو تثبيت Xcode لاستخدام هذه الواجهة، وقد يطلب Python النظام أدوات Apple إذا لم يكن مثبتاً فعلياً؛ نسخة python.org تتجنب الاعتماد عليه.</p><p class="note">${esc(state.runtime)}</p><h3>حالة التجربة</h3><p class="muted">واجهة macOS غير موقعة بشهادة Apple وغير notarized. التحديث الذاتي يتحقق من بصمة SHA-256 المنشورة مع إصدار GitHub ويحفظ نسخة احتياطية قبل الاستبدال.</p><h3>الحدود</h3><p class="muted">لا توجد قاعدة توافق شاملة لكل PCI/USB أو إصلاح تلقائي شامل. بصمة PC لا تتحول إلى Touch ID. وجود القطعة أو التعريف لا يثبت عمله. لا يتم توليد ACPI أو USB Map أو تثبيت root patches تلقائياً.</p><h3>الخصوصية</h3><p class="muted">الفحص محلي، والتقرير لا يُرسل تلقائياً. استعلام الإصدارات يتصل بـGitHub عند تفعيله. config يظهر محلياً داخل المحرر، ولا يدخل كاملاً في التقرير. راجع التقرير قبل مشاركته؛ مرشّح الهوية لا يخفي بالضرورة كل قيمة حساسة.</p><button class="textbutton" data-action="link" data-url="https://dortania.github.io/OpenCore-Install-Guide/">دليل OpenCore ↗</button><button class="textbutton" data-action="link" data-url="https://www.python.org/downloads/macos/">Python للماك ↗</button></div>`;}
function appUpdates(){const u=state.appUpdate;return `<h2 class="sectiontitle">تحديث Noor Probe</h2><div class="card"><p class="muted">تحقق من GitHub لجلب آخر إصدار. عند توفر نسخة، ينزّل التطبيق ملف الإصدار ويتحقق من بصمته قبل التثبيت وإعادة التشغيل.</p><div class="row"><input class="search" id="updateRepo" dir="ltr" autocomplete="url" placeholder="MahdiBAQER27/NoorProbe" value="${esc(updateRepo)}"><button class="primary" data-action="checkAppUpdate">فحص التحديثات</button></div><p class="note">مصدر التحديث: https://github.com/MahdiBAQER27/NoorProbe/releases. يجب أن تكون صفحة الإصدارات عامة وأن يحتوي كل إصدار على ملف ZIP واحد باسم يتضمن NoorProbe. يتطلب التثبيت بصمة SHA-256 من GitHub. لا تُرسل بيانات جهازك إلى GitHub.</p></div>${u?`<div class="card"><div class="between"><h3>${esc(u.name)}</h3><span class="chip">${esc(u.version)}</span></div><p class="note">${u.available?'يوجد تحديث جديد':'هذا أحدث إصدار منشور'} · الحالي ${esc(u.current)} · ${esc(u.repo)}</p>${u.notes?`<pre>${esc(u.notes)}</pre>`:''}${u.available?`<button class="primary" data-action="downloadAppUpdate" ${!u.digest?'disabled':''}>تنزيل التحديث والتحقق منه · ${(u.size/1048576).toFixed(1)} MiB</button>${!u.digest?'<p class="note">هذا الإصدار لا يحتوي بصمة SHA-256 منشورة؛ التثبيت التلقائي متوقف.</p>':''}`:''}</div>`:''}${state.updatePath?`<div class="card"><h3>الملف جاهز وبصمته تطابق مع GitHub</h3><p class="note">الإصدار ${esc(u?.version||'')}</p><button class="primary" data-action="installAppUpdate">تثبيت وإعادة تشغيل Noor Probe</button></div>`:''}`;}

function deep(){const d=state.report?.snapshot?.deep;return `<h2 class="sectiontitle">الموجود والمتعرّف عليه والمستخدم</h2><div class="note">الفحص من داخل macOS لا يكشف بالضرورة أجهزة أخفاها BIOS/ACPI. أسماء الخدمات والـBundle IDs أدلة للمراجعة وليست شهادة عمل. الاتصال بالإنترنت واختبارات الصوت والشاشة تبقى غير مختبرة.</div>${d?`<div class="card"><h3>واجهات الشبكة وحالتها الحالية</h3>${d.network.map(n=>`<div class="listrow"><div><strong>${esc(n.name)} · ${esc(n.interface)}</strong><small>الرابط: ${esc(n.link)} · IP: ${n.has_ipv4?'موجود':'غير مرصود'} · راديو Wi-Fi: ${esc(n.radio)}</small><small>${n.default_route?'واجهة المسار الافتراضي IPv4':'ليست واجهة المسار الافتراضي IPv4'} · الإنترنت: لم يُختبر</small></div><span class="chip">متعرّف عليه كواجهة</span></div>`).join('')||empty('لم ترصد واجهات أو تعذر الاستعلام.')}<p class="note">itlwm قد يظهر كواجهة Ethernet؛ اسم نوع المنفذ وحده لا يحدد نوع القطعة. عدم استخدام المسار الافتراضي لا يعني تعطلاً.</p></div>${d.devices.map(x=>`<details><summary>${esc(x.name)} <span class="badge">${esc(x.bus)} ${esc(x.vendor)}:${esc(x.device)}</span></summary><p>الوجود: ظهر في IORegistry · التعرف الوظيفي: ${x.interfaces.length?'توجد واجهة تحت شجرته':'غير محسوم'} · العمل الفعلي: يحتاج اختباراً</p><pre>${esc(JSON.stringify({interfaces:x.interfaces,driver_services:x.driver_services,driver_bundle_candidates:x.driver_bundle_candidates,loaded_bundle_candidates:x.loaded_bundle_candidates,loaded_check:x.loaded_check,network_evidence:x.network_evidence},null,2))}</pre><p class="note">${esc(x.note)}</p></details>`).join('')}<div class="note">${esc((d.errors||[]).join(' · '))}</div>`:empty('أعد فحص الجهاز بهذه النسخة لجمع أدلة الفحص المتعمّق.')}`;}
function efiBrowser(){const result=state.efiList;return `<div class="between"><h2 class="sectiontitle">أقسام EFI المخفية</h2><button class="primary" data-action="listEFI">اكتشاف / تحديث الأقسام</button></div><p class="note">الفحص يعرض أقسام EFI دون تركيبها. زر الإظهار يطلب تركيبها بالطريقة المعتادة لتظهر ملفاتها في Finder. صلاحية المسؤول قد تكون مطلوبة. بعد التركيب تستطيع تصفح الملفات ونسخها يدوياً؛ كن حذراً من تعديل ملفات الإقلاع. لا نجزم أي قسم استخدمه الإقلاع الحالي، ولا نجري فورمات.</p>${result?result.partitions.map(p=>`<div class="card"><div class="between"><h3 dir="ltr">${esc(p.id)} · ${esc(p.name||'EFI')}</h3><span class="chip">${p.mounted?'مركّب':'غير مركّب'}</span></div>${p.error?`<p class="note">${esc(p.error)}</p>`:`<p class="path">${esc(p.mount||'No mount point')} · ${Math.round((p.size||0)/1048576)} MiB · ReadOnly: ${esc(p.readonly??'unknown')}</p><div class="row">${p.mounted?`<button data-action="showEFI" data-id="${esc(p.id)}">فتح في Finder</button>`:`<button data-action="mountEFI" data-id="${esc(p.id)}">إظهار وفتح EFI</button><button data-action="mountAdmin" data-id="${esc(p.id)}">تركيب بصلاحية مسؤول…</button>`}</div>${(p.configs||[]).map(path=>`<div class="listrow"><span class="path">${esc(path)}</span><button data-action="selectEFISource" data-path="${esc(path)}">اختيار كمصدر EFI</button></div>`).join('')}${p.mounted&&!p.configs.length?'<p class="note">لم يُعثر على config في EFI/OC أو OC. افتح Finder للتأكد من محتويات القسم.</p>':''}`}</div>`).join('')+`<div class="note">${esc(result.note)}</div>`:empty('اضغط اكتشاف الأقسام. إذا طلب النظام صلاحية مسؤول، تُدخلها في نافذة macOS فقط.')}`;}
function catalog(){return `<h2 class="sectiontitle">التنزيل والتطبيق</h2><div class="card"><h3>مصدر GitHub</h3><div class="row"><input class="search" id="repo" dir="ltr" value="${esc(repoValue)}" placeholder="owner/repo"><button class="primary" data-action="getReleases">جلب الإصدارات</button></div><div class="tabs" style="margin-top:12px">${['acidanthera/Lilu','acidanthera/WhateverGreen','acidanthera/AppleALC','OpenIntelWireless/itlwm','acidanthera/OpenCorePkg'].map(r=>`<button data-repo="${esc(r)}">${esc(r.split('/')[1])}</button>`).join('')}</div><p class="note">يمكن إدخال مستودع عام آخر. راجع المصدر والتوافق بنفسك. لا يوجد اختيار تلقائي للإصدار المناسب، ولا تُطلب مفاتيح GitHub.</p></div>${state.catalog?`<h3 dir="ltr">${esc(state.catalog.repo)}</h3>${state.catalog.releases.map(r=>`<details><summary>${esc(r.tag)} ${r.prerelease?'• تجريبي':''}</summary><pre>${esc(r.notes)}</pre>${r.assets.map(a=>`<div class="listrow"><div><strong dir="ltr">${esc(a.name)}</strong><small>${(a.size/1048576).toFixed(1)} MiB · ${a.digest?'المصدر يوفّر بصمة':'لا توجد بصمة مصدر معلنة'}</small></div><button data-action="downloadAsset" data-id="${a.id}" ${!a.name.toLowerCase().endsWith('.zip')||a.size>209715200?'disabled':''}>تنزيل فقط</button></div>`).join('')}</details>`).join('')}`:''}<div class="between"><h2 class="sectiontitle">الملفات المنزّلة</h2><button data-action="getDownloads">تحديث التنزيلات</button></div><label class="note"><input id="replace" type="checkbox" ${replace?'checked':''}>السماح بالاستبدال عند التطبيق بعد التأكيد</label>${(state.downloads||[]).map(d=>`<div class="card"><h3 dir="ltr">${esc(d.name)}</h3><p class="note">${esc(d.repo)} · ${d.source_digest_verified?'تطابقت بصمة SHA-256 مع المصدر':'SHA-256 محلية؛ لا توجد مطابقة مصدر مثبتة'}</p><div class="path">${esc(d.sha256)}</div>${d.items.map(i=>`<div class="listrow"><div><strong dir="ltr">${esc(i.path)}</strong><small>${esc(i.kind)}</small></div><button data-action="applyDownload" data-download="${esc(d.id)}" data-path="${esc(i.path)}" ${!state.workspace?'disabled':''}>تطبيق على Candidate…</button></div>`).join('')||'<p class="note">لا توجد kext أو aml أو efi قابلة للاستيراد؛ لم يُشغّل أي ملف داخل التنزيل.</p>'}</div>`).join('')||empty('نزّل ملف ZIP ثم حدّث القائمة. التنزيل لا يساوي التطبيق.')}<div class="banner">التطبيق هنا يعني استيراد الملف المختار إلى Candidate وتحديث مرجعه، وليس تحديث OpenCore بالكامل أو تثبيت برنامج مساعد مثل HeliPort. تغيير OpenCore.efi وترحيل config بين الإصدارات غير آلي.</div>`;}

const aiProviders={google:['Google AI Studio','gemini-3-flash-preview'],groq:['Groq','qwen/qwen3.8-27b'],router:['OpenRouter','openrouter/free'],cloudflare:['Cloudflare Workers AI',''],hf:['Hugging Face','']};
const aiModels={}, aiAccount={value:''}, aiDraft={question:'',provider:'all',withReport:false};
function ai(){
 return `<div class="hero"><div class="heroicon" aria-hidden="true">✦</div><div><h2>مساعد الفحص</h2><p>اسأل عن قطعة، تعريف أو كود تشخيص.</p><small>اختياري بالكامل؛ الفحص المحلي ومراجعة نطاقات التعريفات يعملان من دونه.</small></div></div>
 <details><summary>مفاتيح API • ${Object.keys(state.aiConfigured||{}).length} من 5</summary>

 <p class="note">المفاتيح للجلسة الحالية. اختر حساباً ونموذجاً ضمن حصة مجانية عند المزوّد. أي إجابة تصل من خدمة خارجية.</p></details>
 <div class="card"><label for="aiProvider">المزوّد <select id="aiProvider"><option value="all">كل المزوّدين المضافين</option>${Object.keys(state.aiConfigured||{}).map(id=>`<option value="${id}" ${aiDraft.provider===id?'selected':''}>${aiProviders[id][0]}</option>`).join('')}</select></label>
 <label><input id="aiInclude" type="checkbox" ${aiDraft.withReport?'checked':''} ${!state.report?'disabled':''}> إرفاق خلاصة آخر فحص</label>
 <textarea class="ai-question" id="aiQuestion" maxlength="4000" aria-label="السؤال" placeholder="مثال: ليش الواي فاي ظاهر لكنه ما يستخدم؟"></textarea><button class="primary" data-action="askAI" ${!Object.keys(state.aiConfigured||{}).length?'disabled':''}>إرسال السؤال</button></div>
 ${state.aiQuestion?`<p class="note">${esc(state.aiQuestion)}</p>`:''}
 ${(state.aiAnswers||[]).map(a=>`<article class="card"><h3>${esc(aiProviders[a.provider]?.[0])}</h3><p class="ai-answer">${esc(a.answer||a.error||'جواب فارغ')}</p></article>`).join('')}`;
}
function externalInventory(){
 const rows=state.inventory?.rows||[];
 return `<section class="card"><h3>مقارنة PCI من نظام مستقل</h3><p class="note">على نفس الجهاز أقلع Linux من USB وشغّل lspci -Dn واحفظ الخرج بملف. المقارنة بالمعرّف والعدد، فالقطع المتطابقة قد تتشارك المعرّف. غياب المعرف عن تقرير macOS يحتاج مراجعة، خصوصاً إذا تغيّر أو جرى تمويهه.</p>
 <button data-action="inventory" ${!state.report?.snapshot?.probes?.pci?.ok?'disabled':''}>استيراد تقرير Linux</button>
 ${rows.map(r=>`<div class="listrow"><span class="chip ${r.linux>r.macos?'warning':''}">${esc(r.id)}</span><span>Linux: ${r.linux} · macOS: ${r.macos}</span><span>${r.linux>r.macos?'رُصد في Linux أكثر من macOS':'رُصد المعرّف في النظامين'}</span></div>`).join('')}</section>`;
}
let selectedTheme='system';
try {selectedTheme=localStorage.getItem('noor-theme')||'system';} catch {}
function applyTheme(){
 if(selectedTheme==='system')delete document.documentElement.dataset.theme;
 else document.documentElement.dataset.theme=selectedTheme;
 $('theme').value=selectedTheme;
}
function render(){
 $('nav').innerHTML=pages.map(([key,icon,title])=>`<button data-page="${key}" class="${page===key?'selected':''}"><span class="icon" aria-hidden="true">${icon}</span>${title}</button>`).join('');
 $('heading').textContent=pages.find(x=>x[0]===page)[2];$('status').textContent=state.status;$('spinner').hidden=!state.busy;
 $('content').innerHTML=({overview,hardware,issues,drivers,workspace,about,deep,efiBrowser,catalog,ai,updates:appUpdates}[page])();
 if(page==='deep')$('content').innerHTML+=externalInventory();
 if($('aiQuestion'))$('aiQuestion').value=aiDraft.question;
 if($('editor'))$('editor').value=editorDraft;
 document.querySelectorAll('[data-action]').forEach(b=>{if(state.busy)b.disabled=true;else if(b.dataset.action==='export')b.disabled=!state.report;});
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.repo){repoValue=b.dataset.repo;render();return;}
 if(b.dataset.page){page=b.dataset.page;render();return;}
 if(b.dataset.tab){tab=b.dataset.tab;render();return;}
 const a=b.dataset.action;if(!a)return;
 if(a==='scan'||a==='scanCandidate')send('scan',{updates,candidate:a==='scanCandidate'});
 else if(a==='link')send('openLink',{url:b.dataset.url});
 else if(a==='import')send('import',{kind:b.dataset.kind,replace});
 else if(a==='toggle')send('toggle',{bundle:b.dataset.bundle,enabled:b.dataset.enabled==='true'});
 else if(a==='saveConfig')send(a,{xml:editorDraft});
 else if(a==='layout')send(a,{value:layoutValue});
 else if(a==='restore')send(a,{revision:b.dataset.revision});
 else if(a==='validate')send(a,{version:ocVersion});
 else if(a==='getReleases')send(a,{repo:repoValue});
 else if(a==='checkAppUpdate')send(a,{repo:updateRepo});
 else if(a==='downloadAppUpdate'||a==='installAppUpdate')send(a);
 else if(['mountEFI','mountAdmin','showEFI','downloadAsset'].includes(a))send(a,{id:b.dataset.id});
 else if(a==='selectEFISource')send(a,{path:b.dataset.path});
 else if(a==='applyDownload')send(a,{download:b.dataset.download,path:b.dataset.path,replace});
 else if(a==='aiRemove')send('aiProfile',{provider:b.dataset.provider,remove:true});
 else if(a==='aiProfile'){
   const id=b.dataset.provider, model=aiModels[id]??state.aiConfigured?.[id]??aiProviders[id][1];
   if(model.trim())send(a,{provider:id,model,account:aiAccount.value});
   else alert('أدخل Model ID أولاً');
 }
 else if(a==='askAI')send(a,{question:aiDraft.question,provider:aiDraft.provider,withReport:!!state.report&&aiDraft.withReport});
 else send(a);
});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('issueList').innerHTML=issueList();}if(e.target.id==='editor')editorDraft=e.target.value;if(e.target.id==='layout')layoutValue=e.target.value;if(e.target.id==='ocVersion')ocVersion=e.target.value;if(e.target.id==='repo')repoValue=e.target.value;if(e.target.id==='updateRepo')updateRepo=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='updates')updates=e.target.checked;if(e.target.id==='replace')replace=e.target.checked;if(e.target.id==='updateRepo')updateRepo=e.target.value.trim();});
document.addEventListener('input',e=>{
 if(e.target.dataset?.aiModel)aiModels[e.target.dataset.aiModel]=e.target.value;
 if(e.target.id==='aiQuestion')aiDraft.question=e.target.value;
 if(e.target.id==='aiAccount')aiAccount.value=e.target.value;
});
document.addEventListener('change',e=>{
 if(e.target.id==='aiInclude')aiDraft.withReport=e.target.checked;
 if(e.target.id==='aiProvider')aiDraft.provider=e.target.value;
 if(e.target.id==='theme'){
   selectedTheme=e.target.value;
   try {localStorage.setItem('noor-theme',selectedTheme);} catch {}
   applyTheme();
 }
});
if($('theme'))applyTheme();
render();send('ready');
</script></body></html>
